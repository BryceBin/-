<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">技术 SEO 工作台定位图</title><desc id="desc">展示 Search Console、Merchant Center、Schema、Core Web Vitals 的优化闭环。</desc>
<rect width="1200" height="760" rx="36" fill="#eef2ff"/><g font-family="Arial"><text x="90" y="92" font-size="42" font-weight="800" fill="#111827">技术 SEO 工作台</text><text x="90" y="130" font-size="20" fill="#64748b">把看不见的技术任务拆成 4 个可执行面板</text>
<g transform="translate(90 180)"><rect width="470" height="190" rx="26" fill="#fff" filter="drop-shadow(0 16px 18px rgba(15,23,42,.12))"/><text x="30" y="48" font-size="22" font-weight="800" fill="#2563eb">1. Google Search Console</text><text x="30" y="86" font-size="17" fill="#475569">提交 sitemap.xml、检查未收录、URL Inspection</text><text x="30" y="122" font-size="17" fill="#475569">优先看：产品页、集合页、博客页是否被索引</text><rect x="30" y="148" width="210" height="20" rx="10" fill="#dbeafe"/><rect x="30" y="148" width="148" height="20" rx="10" fill="#2563eb"/></g>
<g transform="translate(640 180)"><rect width="470" height="190" rx="26" fill="#fff" filter="drop-shadow(0 16px 18px rgba(15,23,42,.12))"/><text x="30" y="48" font-size="22" font-weight="800" fill="#16a34a">2. Product Schema</text><text x="30" y="86" font-size="17" fill="#475569">补 price、availability、shipping、return policy</text><text x="30" y="122" font-size="17" fill="#475569">用 Rich Results Test 验证商品富结果资格</text><rect x="30" y="148" width="210" height="20" rx="10" fill="#dcfce7"/><rect x="30" y="148" width="126" height="20" rx="10" fill="#16a34a"/></g>
<g transform="translate(90 430)"><rect width="470" height="190" rx="26" fill="#fff" filter="drop-shadow(0 16px 18px rgba(15,23,42,.12))"/><text x="30" y="48" font-size="22" font-weight="800" fill="#f59e0b">3. Core Web Vitals</text><text x="30" y="86" font-size="17" fill="#475569">压缩图片、减少首屏 JS、稳定图片尺寸</text><text x="30" y="122" font-size="17" fill="#475569">重点看 LCP / INP / CLS 的移动端表现</text><rect x="30" y="148" width="210" height="20" rx="10" fill="#fef3c7"/><rect x="30" y="148" width="104" height="20" rx="10" fill="#f59e0b"/></g>
<g transform="translate(640 430)"><rect width="470" height="190" rx="26" fill="#fff" filter="drop-shadow(0 16px 18px rgba(15,23,42,.12))"/><text x="30" y="48" font-size="22" font-weight="800" fill="#7c3aed">4. Merchant Center</text><text x="30" y="86" font-size="17" fill="#475569">上传商品 feed，开启 free listings</text><text x="30" y="122" font-size="17" fill="#475569">让价格、库存、配送有机会出现在购物结果</text><rect x="30" y="148" width="210" height="20" rx="10" fill="#ede9fe"/><rect x="30" y="148" width="96" height="20" rx="10" fill="#7c3aed"/></g></g>
</svg>
