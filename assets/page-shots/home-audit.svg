<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Keepstore 首页问题定位图</title>
  <desc id="desc">基于公开抓取内容复刻的首页截图式定位图，标注抽象标题、大量图片文本和底部占位链接问题。</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="760" rx="36" fill="#eef4ff"/>
  <g filter="url(#shadow)">
    <rect x="70" y="54" width="1060" height="650" rx="26" fill="#fff"/>
    <rect x="70" y="54" width="1060" height="54" rx="26" fill="#0f172a"/>
    <circle cx="105" cy="81" r="8" fill="#ef4444"/><circle cx="132" cy="81" r="8" fill="#f59e0b"/><circle cx="159" cy="81" r="8" fill="#22c55e"/>
    <text x="196" y="87" font-family="Arial" font-size="17" fill="#cbd5e1">keepstore.com / 首页</text>
    <rect x="102" y="132" width="996" height="38" rx="19" fill="#ecfdf5"/>
    <text x="136" y="157" font-family="Arial" font-size="18" font-weight="700" fill="#047857">Free Shipping on Orders $50+</text>
    <text x="102" y="224" font-family="Arial" font-size="50" font-weight="800" fill="#111827">DISCIPLINE SETS ME FREE</text>
    <text x="102" y="274" font-family="Arial" font-size="21" fill="#64748b">Mission &amp; Vision: A healthy lifestyle starts from movement...</text>
    <g transform="translate(102 318)">
      <rect width="122" height="86" rx="14" fill="#dbeafe"/><rect x="145" width="122" height="86" rx="14" fill="#dbeafe"/><rect x="290" width="122" height="86" rx="14" fill="#dbeafe"/><rect x="435" width="122" height="86" rx="14" fill="#dbeafe"/><rect x="580" width="122" height="86" rx="14" fill="#dbeafe"/>
      <text x="36" y="52" font-family="Arial" font-size="15" fill="#2563eb">Image</text><text x="181" y="52" font-family="Arial" font-size="15" fill="#2563eb">Image</text><text x="326" y="52" font-family="Arial" font-size="15" fill="#2563eb">Image</text><text x="471" y="52" font-family="Arial" font-size="15" fill="#2563eb">Image</text><text x="616" y="52" font-family="Arial" font-size="15" fill="#2563eb">Image</text>
    </g>
    <rect x="102" y="500" width="996" height="142" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="130" y="540" font-family="Arial" font-size="19" font-weight="700" fill="#334155">ABOUT US</text>
    <text x="130" y="580" font-family="Arial" font-size="17" fill="#64748b">Our Story · Team · Our Business · Media · Investors · Blog · Sweat Collective</text>
    <text x="130" y="618" font-family="Arial" font-size="17" fill="#64748b">FAQ · Accessibility Statement · Ordering · Shipping Policy · Returns · Privacy Policy</text>
  </g>
  <g font-family="Arial">
    <rect x="720" y="196" width="350" height="70" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="742" y="226" font-size="18" font-weight="700" fill="#9a3412">问题 1：首屏标题太抽象</text>
    <text x="742" y="252" font-size="15" fill="#9a3412">没有直接说明卖什么、适合谁</text>
    <path d="M720 232 L560 220" stroke="#fb923c" stroke-width="3" fill="none"/>
    <rect x="750" y="328" width="320" height="92" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="772" y="358" font-size="18" font-weight="700" fill="#1d4ed8">问题 2：图片文本过多</text>
    <text x="772" y="384" font-size="15" fill="#1d4ed8">抓取内容大量显示为 Image</text>
    <text x="772" y="406" font-size="15" fill="#1d4ed8">需要补 alt 与可读文案</text>
    <path d="M750 376 L650 360" stroke="#3b82f6" stroke-width="3" fill="none"/>
    <rect x="720" y="548" width="350" height="82" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <text x="742" y="580" font-size="18" font-weight="700" fill="#b91c1c">问题 3：底部像模板占位</text>
    <text x="742" y="606" font-size="15" fill="#b91c1c">无内容链接会降低信任感</text>
    <path d="M720 588 L550 574" stroke="#ef4444" stroke-width="3" fill="none"/>
  </g>
</svg>
